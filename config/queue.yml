default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Fast worker pool for lightweight background jobs
    - queues: [ default ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    # Single-concurrency pool for memory-intensive Audiveris OMR and audio transcription jobs
    - queues: [ omr ]
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
