<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estúdio de Piano — Todo Nó &amp; Repertório</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f4f6f9;
      --bg-card: #ffffff;
      --bg-subtle: #eef2f6;
      --bg-sheet: #ffffff;
      --border: #d8e0ea;
      --text-main: #0f172a;
      --text-muted: #475569;
      --lh-blue: #2563eb;
      --rh-green: #059669;
      --vox-amber: #d97706;
    }
    html.dark {
      --bg-page: #090e1a;
      --bg-card: #111827;
      --bg-subtle: #1e293b;
      --bg-sheet: #0f172a;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --lh-blue: #93c5fd;
      --rh-green: #6ee7b7;
      --vox-amber: #fcd34d;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
    }
    .subtle {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
    }
    .sheet-surface {
      background-color: var(--bg-sheet);
      border: 1px solid var(--border);
    }
    select option, select optgroup {
      background-color: var(--bg-card);
      color: var(--text-main);
    }

    /* Modo Foco */
    body.focus-mode .hide-in-focus { display: none !important; }
    body.focus-mode #app-shell { max-width: 1180px; padding-top: 0.5rem; }

    /* Partitura SVG */
    .sheet-container {
      width: 100%;
      height: 310px;
      overflow: hidden;
    }
    .sheet-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Teclado Fixo */
    .piano-wrap {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .piano-bed {
      position: relative;
      height: 168px;
      min-width: 780px;
      width: 100%;
      user-select: none;
    }
    .voice-bed {
      position: relative;
      height: 82px;
      min-width: 660px;
      width: 100%;
      user-select: none;
    }
    .w-key {
      position: absolute;
      top: 0;
      bottom: 0;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      border: 1px solid #94a3b8;
      border-bottom-left-radius: 7px;
      border-bottom-right-radius: 7px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 7px;
      cursor: pointer;
      z-index: 1;
      transition: background 0.08s, transform 0.06s;
    }
    html.dark .w-key {
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      border-color: #475569;
    }
    .w-key:hover { background: #e2e8f0; }
    .b-key {
      position: absolute;
      top: 0;
      height: 60%;
      background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
      border: 1px solid #020617;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 5px;
      cursor: pointer;
      z-index: 3;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
      transition: background 0.08s;
    }
    .b-key:hover { background: #475569; }

    /* Estados das teclas */
    .w-key.lh-target { background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 100%) !important; border-color: #2563eb !important; }
    .b-key.lh-target { background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%) !important; }
    .w-key.rh-target { background: linear-gradient(180deg, #d1fae5 0%, #a7f3d0 100%) !important; border-color: #059669 !important; }
    .b-key.rh-target { background: linear-gradient(180deg, #059669 0%, #065f46 100%) !important; }
    .w-key.vox-target { background: linear-gradient(180deg, #fef3c7 0%, #fde68a 100%) !important; border-color: #d97706 !important; }
    .b-key.vox-target { background: linear-gradient(180deg, #d97706 0%, #92400e 100%) !important; }

    .w-key.now-playing, .b-key.now-playing {
      transform: translateY(2px);
      box-shadow: inset 0 0 0 3px #f59e0b, 0 0 14px rgba(245, 158, 11, 0.7) !important;
      z-index: 4;
    }

    .key-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      pointer-events: none;
      line-height: 1;
    }
    .b-key .key-lbl {
      font-size: 9px;
      color: #e2e8f0;
    }
    .f-dot {
      position: absolute;
      top: 7px;
      width: 22px;
      height: 22px;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.35);
      pointer-events: none;
      z-index: 5;
    }
    .f-dot.lh { background-color: #2563eb; }
    .f-dot.rh { background-color: #059669; }
    .f-dot.vox { background-color: #d97706; top: 5px; width: 18px; height: 18px; font-size: 10px; }

    .ord-tag {
      position: absolute;
      top: 32px;
      padding: 1px 4px;
      border-radius: 4px;
      background: #0f172a;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div id="app-shell" class="max-w-5xl mx-auto px-3 sm:px-5 py-3 flex flex-col gap-3">

    <!-- 1. CABEÇALHO E SELETOR DE MÚSICA / NÍVEL -->
    <header class="card rounded-2xl px-4 py-3 shadow-sm flex flex-col gap-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2.5">
        <div class="flex items-center gap-3 min-w-0 flex-wrap">
          <div class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-extrabold text-base flex-shrink-0 shadow-sm">
            🎹
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <select id="song-select" aria-label="Escolher Música" class="subtle rounded-xl px-2.5 py-1 text-sm sm:text-base font-extrabold text-[var(--text-main)] cursor-pointer focus:outline-none">
                <option value="todo-no" selected>Todo Nó — Dingo Bells</option>
                <option value="alabama-song">Alabama Song — The Doors</option>
                <option value="bach-prelude-c">Prelude in C BWV 846 — J. S. Bach</option>
                <option value="hallelujah">Hallelujah — Leonard Cohen</option>
                <option value="country-roads">Take Me Home, Country Roads — John Denver</option>
                <option value="binks-sake">Binks' Sake (One Piece) — Kouhei Tanaka</option>
                <option value="sadness-sorrow">Sadness and Sorrow (Naruto) — Toshiro Masuda</option>
                <option value="rocket-man">Rocket Man — Elton John</option>
              </select>
              <span id="song-meta-tag" class="text-xs font-semibold text-[var(--text-muted)]">Tom: D • 76 BPM • 4/4</span>
            </div>
            <div class="flex items-center gap-2 mt-1">
              <span id="step-counter" class="font-mono-code text-[11px] font-bold text-blue-600 dark:text-blue-300">Compasso 1 / 81</span>
              <span class="text-[var(--border)]">•</span>
              <span id="audio-engine-badge" class="text-[11px] font-medium text-[var(--text-muted)]">⏳ Carregando Piano...</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <div class="flex items-center gap-1.5 subtle rounded-xl px-2.5 py-1">
            <label for="level-select" class="text-[11px] font-bold text-[var(--text-muted)]">Nível:</label>
            <select id="level-select" aria-label="Nível Progressivo Conectado" class="bg-[var(--bg-subtle)] text-xs font-extrabold text-[var(--text-main)] rounded-lg px-1.5 py-0.5 focus:outline-none cursor-pointer">
              <option value="easy">1. Base Essencial (Fácil)</option>
              <option value="medium">2. + Arpejos &amp; Groove (Médio)</option>
              <option value="original">3. + Detalhes Completos (Avançado)</option>
              <option value="faithful" selected>4. Original Fiel (Sem Firula)</option>
            </select>
          </div>

          <button type="button" id="btn-toggle-voice" class="px-2.5 py-1.5 rounded-xl text-xs font-bold subtle text-[var(--text-main)] hover:opacity-85 cursor-pointer transition">
            🎤 Voz
          </button>

          <button type="button" id="btn-toggle-map" class="hide-in-focus px-2.5 py-1.5 rounded-xl text-xs font-bold subtle text-[var(--text-main)] hover:opacity-85 cursor-pointer transition">
            🗺️ Seções
          </button>

          <button type="button" id="btn-focus" class="px-2.5 py-1.5 rounded-xl text-xs font-bold subtle text-[var(--text-main)] hover:opacity-85 cursor-pointer transition" title="Modo Foco sem distrações (Tecla F)">
            🎯 Foco
          </button>

          <button type="button" id="btn-theme" class="px-2.5 py-1.5 rounded-xl text-xs font-bold subtle text-[var(--text-main)] hover:opacity-85 cursor-pointer transition" title="Alternar Tema Claro/Escuro">
            🌓
          </button>
        </div>
      </div>

      <!-- Painel recolhível de Seções -->
      <div id="sections-drawer" class="hidden hide-in-focus pt-2 border-t border-[var(--border)] flex flex-col gap-2">
        <div id="section-tabs" class="flex items-center gap-1.5 flex-wrap"></div>
        <div id="timeline-strip" class="flex items-center gap-1 overflow-x-auto pb-1"></div>
      </div>
    </header>

    <!-- 2. PLAYER NO TOPO + PARTITURA AMPLIADA -->
    <section class="card rounded-2xl p-3.5 sm:p-4 shadow-sm flex flex-col gap-3">
      <!-- Barra de Play no Topo -->
      <div class="subtle rounded-xl px-3 py-2 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 flex-wrap">
          <button type="button" id="btn-play-song" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold bg-emerald-600 hover:bg-emerald-700 text-white cursor-pointer transition shadow-sm" title="Atalho: Barra de Espaço">
            🎵 Música Inteira
          </button>
          <button type="button" id="btn-play-section" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white cursor-pointer transition">
            ▶▶ Seção
          </button>
          <button type="button" id="btn-play-step" class="px-3 py-1.5 rounded-xl text-xs font-bold card text-[var(--text-main)] hover:opacity-85 cursor-pointer transition">
            ▶ Compasso
          </button>
          <label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl card text-xs font-semibold text-[var(--text-main)] cursor-pointer">
            <input type="checkbox" id="chk-loop" class="w-3.5 h-3.5 rounded accent-blue-600 cursor-pointer">
            Loop
          </label>
          <label class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl card text-xs font-semibold text-[var(--text-main)] cursor-pointer">
            <input type="checkbox" id="chk-metro" class="w-3.5 h-3.5 rounded accent-blue-600 cursor-pointer">
            Metrônomo
          </label>
        </div>

        <div class="flex items-center gap-1">
          <button type="button" id="btn-prev" class="px-2.5 py-1 rounded-xl text-xs font-bold card text-[var(--text-main)] hover:opacity-80 disabled:opacity-40 cursor-pointer" title="Compasso Anterior (←)">
            ◀
          </button>
          <select id="step-select" aria-label="Escolher Compasso" class="px-2.5 py-1 rounded-xl text-xs font-semibold card text-[var(--text-main)] max-w-[190px] cursor-pointer"></select>
          <button type="button" id="btn-next" class="px-2.5 py-1 rounded-xl text-xs font-bold card text-[var(--text-main)] hover:opacity-80 disabled:opacity-40 cursor-pointer" title="Próximo Compasso (→)">
            ▶
          </button>
        </div>
      </div>

      <!-- Cabeçalho do compasso -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div id="chord-badge" class="font-mono-code text-base sm:text-lg font-extrabold px-3 py-1 rounded-xl bg-emerald-500/20 text-emerald-800 dark:text-emerald-200 border border-emerald-500/40 whitespace-nowrap">
            D
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span id="measure-badge" class="font-mono-code text-[11px] font-bold px-2 py-0.5 rounded bg-blue-500/20 text-blue-800 dark:text-blue-200 whitespace-nowrap">
                Comp. 1
              </span>
              <h2 id="step-title" class="text-sm sm:text-base font-extrabold truncate text-[var(--text-main)]">
                Introdução — D
              </h2>
            </div>
            <p id="step-lyric" class="text-xs font-medium text-[var(--text-muted)] truncate mt-0.5">
              Abertura instrumental (0:00)
            </p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 flex-wrap">
          <button type="button" id="btn-sheet-zoom" class="px-2.5 py-1.5 rounded-xl text-xs font-bold subtle text-[var(--text-main)] hover:opacity-85 cursor-pointer transition">
            🔍 Zoom: 1 Compasso
          </button>

          <label class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl subtle text-xs font-semibold text-[var(--text-main)] cursor-pointer select-none">
            <input type="checkbox" id="chk-notes-on-sheet" checked class="w-3.5 h-3.5 rounded accent-blue-600 cursor-pointer">
            Cifras
          </label>

          <button type="button" id="btn-unfreeze" class="hidden px-2.5 py-1.5 rounded-xl text-xs font-bold bg-amber-500/25 text-amber-900 dark:text-amber-200 cursor-pointer">
            ✕ Liberar tempo
          </button>
        </div>
      </div>

      <!-- PARTITURA SVG -->
      <div class="sheet-container sheet-surface rounded-xl shadow-inner">
        <svg id="sheet-svg" class="sheet-svg" viewBox="0 0 960 310" role="img" aria-label="Partitura sincronizada"></svg>
      </div>

      <!-- Dica e legenda -->
      <div class="hide-in-focus flex items-center justify-between gap-2 flex-wrap px-3 py-2 rounded-xl subtle text-xs">
        <div class="leading-snug">
          <strong class="font-bold text-blue-700 dark:text-blue-300">Dica:</strong>
          <span id="step-tip" class="text-[var(--text-main)]"></span>
        </div>
        <div class="flex items-center gap-2 text-[11px] flex-shrink-0">
          <span class="px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-800 dark:text-emerald-200 font-bold">Sol = MD</span>
          <span class="px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-800 dark:text-blue-200 font-bold">Fá = ME</span>
          <span id="legend-voice-pill" class="hidden px-2 py-0.5 rounded-full bg-amber-500/25 text-amber-900 dark:text-amber-200 font-bold">◆ Voz</span>
        </div>
      </div>
    </section>

    <!-- 3. TECLADO PRINCIPAL + MÃOS E ANDAMENTO -->
    <section class="card rounded-2xl p-3.5 sm:p-4 shadow-sm flex flex-col gap-3">
      <!-- Teclado Guia da Voz (opcional) -->
      <div id="voice-keyboard-panel" class="hidden hide-in-focus subtle rounded-xl p-2.5 border-l-4 border-l-amber-500 flex flex-col gap-1.5">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <span class="text-xs font-bold text-amber-800 dark:text-amber-200">
            🎤 Guia da Voz (Opcional)
          </span>
          <div class="flex items-center gap-2.5 flex-wrap">
            <select id="voice-timbre-select" aria-label="Timbre da Voz" class="px-2 py-0.5 rounded-lg text-[11px] font-semibold card text-[var(--text-main)] cursor-pointer">
              <option value="rhodes" selected>Rhodes</option>
              <option value="piano">Piano Agudo</option>
              <option value="oohs">Voz Suave</option>
            </select>
            <label class="inline-flex items-center gap-1.5 text-xs font-semibold text-[var(--text-main)] cursor-pointer">
              <input type="checkbox" id="chk-voice-audio" checked class="w-3.5 h-3.5 rounded accent-amber-500 cursor-pointer">
              Ouvir
            </label>
          </div>
        </div>
        <div class="piano-wrap">
          <div class="voice-bed" id="voice-bed"></div>
        </div>
      </div>

      <!-- Teclado Fixo Principal (C2 a A5) -->
      <div class="piano-wrap">
        <div class="piano-bed" id="piano-bed"></div>
      </div>

      <!-- Dock de Prática -->
      <div class="subtle rounded-xl p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-1 bg-slate-200/80 dark:bg-slate-900 p-1 rounded-xl border border-[var(--border)] self-start sm:self-auto">
          <button type="button" data-hand="both" class="hand-btn px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer transition">2 Mãos</button>
          <button type="button" data-hand="lh" class="hand-btn px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer transition">Só Esquerda</button>
          <button type="button" data-hand="rh" class="hand-btn px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer transition">Só Direita</button>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <label for="bpm-slider" class="text-xs font-bold text-[var(--text-muted)]">
            <span id="bpm-text" class="font-mono-code font-extrabold text-[var(--text-main)]">76 BPM</span>
          </label>
          <input type="range" id="bpm-slider" min="48" max="125" value="76" class="w-24 sm:w-28 accent-blue-600 cursor-pointer">
          <div id="bpm-presets" class="flex items-center gap-1"></div>
        </div>
      </div>
    </section>

  </div>

  <script>
    /* ==========================================================================
       1. TABELA DE NOTAS EM CIFRAS (C2 a A5)
       ========================================================================== */
    const SHARP_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const FLAT_DISPLAY = { "A#": "Bb", "D#": "Eb", "G#": "Ab", "F#": "Gb", "C#": "Db" };

    function midiToId(midi) {
      const oct = Math.floor(midi / 12) - 1;
      return SHARP_NAMES[midi % 12] + oct;
    }

    function displayCipher(noteId, chordName) {
      const m = /^([A-G]#?)(\d)$/.exec(noteId);
      if (!m) return noteId;
      let base = m[1];
      const oct = m[2];
      if (chordName && /(Gm|Eb|Bb|Fm|Cm|C7|\bF\b|F7|Ab|Gb|Db|dim7)/.test(chordName) && FLAT_DISPLAY[base]) {
        if ((base === "F#" || base === "C#") && !/(Gb|Db|Abm|Binks)/.test(chordName)) {
          return base + oct;
        }
        if (base !== "G#" || /(Ab|Fm|Eb|Bb|Bdim7)/.test(chordName)) {
          base = FLAT_DISPLAY[base];
        }
      }
      return base + oct;
    }

    const PIANO_NOTES = [];
    for (let m = 36; m <= 84; m++) {
      const id = midiToId(m);
      const isBlack = id.includes("#");
      PIANO_NOTES.push({ id, midi: m, isBlack, freq: 440 * Math.pow(2, (m - 69) / 12) });
    }
    const NOTE_MAP = Object.fromEntries(PIANO_NOTES.map(n => [n.id, n]));
    const VOICE_NOTES = PIANO_NOTES.filter(n => n.midi >= 55 && n.midi <= 84);

    /* ==========================================================================
       2. ESTRUTURA COMPLETA DE TODO NÓ (81 COMPASSOS)
       ========================================================================== */
    const TODO_NO_SECTIONS = [
      { id: 1, name: "1. Intro" },
      { id: 2, name: "2. Verso 1" },
      { id: 3, name: "3. Verso 2" },
      { id: 4, name: "4. Pré-Refrão 1" },
      { id: 5, name: "5. Refrão 1" },
      { id: 6, name: "6. Deixa o Sol (1)" },
      { id: 7, name: "7. Retorno" },
      { id: 8, name: "8. Verso 3 (Banda)" },
      { id: 9, name: "9. Verso 4 (Banda)" },
      { id: 10, name: "10. Pré-Refrão 2" },
      { id: 11, name: "11. Refrão 2 (2x)" },
      { id: 12, name: "12. Coro Lá-rá-rá" }
    ];

    function mIntroD(level, customTip) {
      const tip = customTip || (level === "easy"
        ? "Nível 1: ME segura D2; MD marca D (D4–F#4–A4) nos tempos 1 e 3."
        : "Nível 2+: ME alterna D2 → A2; MD pulsa em colcheias com o toque cromático A#4 no tempo 4e.");
      if (level === "easy") {
        return {
          chord: "D", pedal: false, tip,
          lh: [{ tick: 0, dur: 16, notes: ["D2"], fingers: [5] }],
          rh: [{ tick: 0, dur: 8, notes: ["D4", "F#4", "A4"], fingers: [1, 2, 4] }, { tick: 8, dur: 8, notes: ["D4", "F#4", "A4"], fingers: [1, 2, 4] }]
        };
      }
      return {
        chord: level === "original" ? "D → Daug" : "D", pedal: false, tip,
        lh: [0, 4, 8, 12].map(t => ({ tick: t, dur: 4, notes: [t % 8 === 0 ? "D2" : "A2"], fingers: [t % 8 === 0 ? 5 : 2] })),
        rh: [
          { tick: 0, dur: 2, notes: ["D4", "F#4", "A4"], fingers: [1, 2, 4] },
          { tick: 2, dur: 2, notes: ["D4", "F#4", "A4"], fingers: [1, 2, 4] },
          { tick: 4, dur: 2, notes: ["D4", "F#4", "A4"], fingers: [1, 2, 4] },

        const childTicks = new Set(childArr.map(x => x.tick));
        const kept = parentArr.filter(x => !childTicks.has(x.tick)).map(x => ({ ...x }));
        return [...kept, ...childArr.map(x => ({ ...x }))].sort((a, b) => a.tick - b.tick);
      };
      const easy = { chord: baseEasy.chord, pedal: !!baseEasy.pedal, tip: baseEasy.tip, lh: baseEasy.lh.map(x => ({ ...x })), rh: baseEasy.rh.map(x => ({ ...x })) };
      const medium = {
        chord: midLayer.chord || easy.chord,
        pedal: midLayer.pedal !== undefined ? midLayer.pedal : easy.pedal,
        tip: midLayer.tip || easy.tip,
        lh: mergeHand(easy.lh, midLayer.lh),
        rh: mergeHand(easy.rh, midLayer.rh)

      const original = {
        chord: advLayer.chord || medium.chord,
        pedal: advLayer.pedal !== undefined ? advLayer.pedal : medium.pedal,
        tip: advLayer.tip || medium.tip,
        lh: mergeHand(medium.lh, advLayer.lh),

      return { easy, medium, original, faithful };

      }
      // Fallback WebAudio
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = isVoice ? "sine" : "triangle";
      osc.frequency.setValueAtTime(nObj.freq, now);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(gainVal * 0.28, now + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, now + durSec);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + durSec);
    }

    function playMetroClick(accent) {
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(accent ? 1200 : 880, now);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    /* ==========================================================================
       4. ESTADO GLOBAL & RENDERIZAÇÃO DE TECLADO + PARTITURA SVG
       ========================================================================== */
    const state = {
      songId: "todo-no",
      level: "faithful",
      handMode: "both",
      bpm: 76,
      stepIndex: 0,
      activeTick: -1,
      frozenTick: -1,
      zoomOneMeasure: true,
      showCiphers: true,
      showVoicePanel: false,
      isPlaying: false,
      playMode: "step",
      timer: null
    };

    let SECTIONS = SONGS["todo-no"].sections;
    let STEPS = SONGS["todo-no"].steps;

    function buildPianoBed(containerId, notesList, isVoice) {
      const bed = document.getElementById(containerId);
      if (!bed) return;
      bed.innerHTML = "";
      const whites = notesList.filter(n => !n.isBlack);
      const wPct = 100 / whites.length;

      whites.forEach((n, i) => {
        const el = document.createElement("div");
        el.className = "w-key";
        el.dataset.note = n.id;
        el.style.left = (i * wPct) + "%";
        el.style.width = wPct + "%";

        const lbl = document.createElement("span");
        lbl.className = "key-lbl";
        lbl.textContent = n.id === "C4" ? "C4" : n.id.replace(/\d/, "");
        el.appendChild(lbl);

        el.addEventListener("pointerdown", () => {
          ensureAudioCtx();
          playTone(n.id, 0.5, 0.7, isVoice);
        });
        bed.appendChild(el);
      });

      notesList.forEach(n => {
        if (!n.isBlack) return;
        const prevWhiteIdx = whites.findIndex(w => w.midi === n.midi - 1);
        if (prevWhiteIdx === -1) return;
        const el = document.createElement("div");
        el.className = "b-key";
        el.dataset.note = n.id;
        el.style.width = (wPct * 0.64) + "%";
        el.style.left = ((prevWhiteIdx + 0.68) * wPct) + "%";

        const lbl = document.createElement("span");
        lbl.className = "key-lbl";
        lbl.textContent = n.id.replace(/\d/, "");
        el.appendChild(lbl);

        el.addEventListener("pointerdown", e => {
          e.stopPropagation();
          ensureAudioCtx();
          playTone(n.id, 0.5, 0.7, isVoice);
        });
        bed.appendChild(el);
      });
    }

    function midiToTrebleY(midi) {
      const stepsFromE4 = { 0: 0, 1: 0, 2: 1, 3: 1, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 5, 10: 5, 11: 6 };
      const oct = Math.floor(midi / 12) - 1;
      const deg = (oct - 4) * 7 + stepsFromE4[midi % 12] - 2;
      return 118 - deg * 6.5;
    }

    function midiToBassY(midi) {
      const stepsFromC = { 0: 0, 1: 0, 2: 1, 3: 1, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 5, 10: 5, 11: 6 };
      const oct = Math.floor(midi / 12) - 1;
      const deg = (oct - 2) * 7 + stepsFromC[midi % 12] - 4;
      return 248 - deg * 6.5;
    }

    function drawSingleMeasureSVG(svg, step, x0, mWidth, isCurrent) {
      const dark = document.documentElement.classList.contains("dark");
      const lineCol = dark ? "#475569" : "#94a3b8";
      const inkCol = dark ? "#f8fafc" : "#0f172a";
      const mutedCol = dark ? "#cbd5e1" : "#64748b";
      const lhCol = dark ? "#93c5fd" : "#1d4ed8";
      const rhCol = dark ? "#6ee7b7" : "#047857";
      const voxCol = dark ? "#fcd34d" : "#b45309";
      const haloCol = dark ? "#0f172a" : "#ffffff";

      const lv = step.levels[state.level] || step.levels.faithful;
      const NS = "http://www.w3.org/2000/svg";
      const addEl = (tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        svg.appendChild(el);
        return el;
      };

      // Linhas das 2 pautas (Clave de Sol e Clave de Fá)
      for (let i = 0; i < 5; i++) {
        addEl("line", { x1: x0, y1: 66 + i * 13, x2: x0 + mWidth, y2: 66 + i * 13, stroke: lineCol, "stroke-width": "1.2" });
        addEl("line", { x1: x0, y1: 196 + i * 13, x2: x0 + mWidth, y2: 196 + i * 13, stroke: lineCol, "stroke-width": "1.2" });
      }
      // Barras verticais de compasso
      addEl("line", { x1: x0, y1: 66, x2: x0, y2: 248, stroke: inkCol, "stroke-width": "2" });
      addEl("line", { x1: x0 + mWidth, y1: 66, x2: x0 + mWidth, y2: 248, stroke: inkCol, "stroke-width": "2" });

      // Título do compasso + acorde
      addEl("text", { x: x0 + 14, y: 34, fill: inkCol, "font-size": "16", "font-weight": "800", "font-family": "JetBrains Mono, monospace" }).textContent = `${step.tag} • ${lv.chord}`;
      if (lv.pedal) {
        addEl("text", { x: x0 + mWidth - 48, y: 278, fill: mutedCol, "font-size": "12", "font-weight": "700", "font-family": "JetBrains Mono, monospace" }).textContent = "Ped.";
      }

      // Claves na margem esquerda
      addEl("text", { x: x0 + 10, y: 112, fill: inkCol, "font-size": "44", "font-family": "serif" }).textContent = "𝄞";
      addEl("text", { x: x0 + 10, y: 238, fill: inkCol, "font-size": "38", "font-family": "serif" }).textContent = "𝄢";

      const padL = 56;
      const usableW = mWidth - padL - 20;
      const tickToX = t => x0 + padL + (t / 16) * usableW;

      // Divisões suaves dos 4 tempos e áreas clicáveis
      for (let b = 0; b < 4; b++) {
        const bx = tickToX(b * 4);
        if (b > 0) {
          addEl("line", { x1: bx, y1: 54, x2: bx, y2: 256, stroke: lineCol, "stroke-width": "1", "stroke-dasharray": "4 4", opacity: "0.55" });
        }
        addEl("text", { x: bx + usableW / 8, y: 50, fill: mutedCol, "font-size": "11", "font-weight": "700", "text-anchor": "middle", "font-family": "JetBrains Mono, monospace" }).textContent = `T${b + 1}`;
      }

      // Playhead (linha vertical azul no tempo ativo)
      const focusT = isCurrent ? (state.frozenTick >= 0 ? state.frozenTick : state.activeTick) : -1;
      if (focusT >= 0) {
        const px = tickToX(focusT);
        addEl("rect", { x: px - 6, y: 52, width: usableW / 8, height: 206, fill: "#3b82f6", opacity: "0.14", rx: "6" });
        addEl("line", { x1: px, y1: 52, x2: px, y2: 258, stroke: "#3b82f6", "stroke-width": "2.5" });
      }

      const drawEvents = (events, isTreble, color, isVox = false) => {
        events.forEach(ev => {
          const cx = tickToX(ev.tick) + 12;
          const notes = isVox ? [ev.note] : ev.notes;
          const fingers = isVox ? [] : ev.fingers;
          notes.forEach((nId, idx) => {
            const nObj = NOTE_MAP[nId];
            if (!nObj) return;
            const cy = isTreble ? midiToTrebleY(nObj.midi) : midiToBassY(nObj.midi);

            // Linhas suplementares
            if (isTreble && nObj.midi <= 60) {
              addEl("line", { x1: cx - 11, y1: 131, x2: cx + 11, y2: 131, stroke: inkCol, "stroke-width": "1.3" });
            }
            if (!isTreble && nObj.midi <= 40) {
              addEl("line", { x1: cx - 11, y1: 261, x2: cx + 11, y2: 261, stroke: inkCol, "stroke-width": "1.3" });
            }

            if (isVox) {
              addEl("polygon", { points: `${cx},${cy - 6} ${cx + 6},${cy} ${cx},${cy + 6} ${cx - 6},${cy}`, fill: color });
            } else {
              addEl("ellipse", {
                cx, cy, rx: "6.5", ry: "4.8",
                fill: ev.dur >= 8 ? haloCol : color,
                stroke: color,
                "stroke-width": "2",
                transform: `rotate(-18 ${cx} ${cy})`
              });
            }

            // Rótulo de cifra + dedo
            if (state.showCiphers && !isVox) {
              const fTxt = fingers[idx] ? `(${fingers[idx]})` : "";
              const lblStr = `${displayCipher(nId, lv.chord)}${fTxt}`;
              const lx = cx + 10;
              const ly = cy + 4;
              addEl("rect", { x: lx - 2, y: ly - 10, width: lblStr.length * 6.8 + 4, height: 13, fill: haloCol, opacity: "0.88", rx: "3" });
              addEl("text", { x: lx, y: ly, fill: color, "font-size": "11", "font-weight": "800", "font-family": "JetBrains Mono, monospace" }).textContent = lblStr;
            }
          });
        });
      };

      if (state.handMode !== "lh") drawEvents(lv.rh, true, rhCol, false);
      if (state.handMode !== "rh") drawEvents(lv.lh, false, lhCol, false);
      if (state.showVoicePanel && step.voice?.length) drawEvents(step.voice, true, voxCol, true);

      // Zonas clicáveis por colcheia para congelar/ouvir aquele instante
      for (let e = 0; e < 8; e++) {
        const hit = addEl("rect", {
          x: tickToX(e * 2), y: 52, width: usableW / 8, height: 206,
          fill: "transparent", style: "cursor: pointer;"
        });
        hit.addEventListener("click", () => {
          if (!isCurrent) {
            state.stepIndex = step.id - 1;
          }
          state.frozenTick = e * 2;
          triggerTickAudio(STEPS[state.stepIndex], state.frozenTick);
          renderMeasureView();
        });
      }
    }

    function renderSheetSVG() {
      const svg = document.getElementById("sheet-svg");
      if (!svg) return;
      svg.innerHTML = "";
      const cur = STEPS[state.stepIndex];
      if (!cur) return;

      if (state.zoomOneMeasure || state.stepIndex >= STEPS.length - 1) {
        drawSingleMeasureSVG(svg, cur, 14, 932, true);
      } else {
        drawSingleMeasureSVG(svg, cur, 14, 460, true);
        drawSingleMeasureSVG(svg, STEPS[state.stepIndex + 1], 486, 460, false);
      }
    }

    function updateKeyboardsHighlight() {
      const step = STEPS[state.stepIndex];
      if (!step) return;
      const lv = step.levels[state.level] || step.levels.faithful;
      const focusT = state.frozenTick >= 0 ? state.frozenTick : state.activeTick;

      document.querySelectorAll("#piano-bed .w-key, #piano-bed .b-key").forEach(k => {
        k.classList.remove("lh-target", "rh-target", "now-playing");
        k.querySelectorAll(".f-dot, .ord-tag").forEach(d => d.remove());
      });

      const applyHand = (events, cls) => {
        if ((cls === "lh" && state.handMode === "rh") || (cls === "rh" && state.handMode === "lh")) return;
        const isArpeggio = events.length >= 4 && new Set(events.map(e => e.notes[0])).size >= 3;
        events.forEach((ev, idx) => {
          const isNow = focusT >= 0 && focusT >= ev.tick && focusT < ev.tick + ev.dur;
          ev.notes.forEach((nId, i) => {
            const keyEl = document.querySelector(`#piano-bed [data-note="${nId}"]`);
            if (!keyEl) return;
            keyEl.classList.add(`${cls}-target`);
            if (isNow) keyEl.classList.add("now-playing");
            if (!keyEl.querySelector(`.f-dot.${cls}`) && ev.fingers[i]) {
              const dot = document.createElement("div");
              dot.className = `f-dot ${cls}`;
              dot.textContent = ev.fingers[i];
              if (cls === "rh") dot.style.right = "3px";
              keyEl.appendChild(dot);
            }
            if (isArpeggio && idx < 6 && !keyEl.querySelector(".ord-tag")) {
              const tag = document.createElement("div");
              tag.className = "ord-tag";
              tag.textContent = `${idx + 1}º`;
              keyEl.appendChild(tag);
            }
          });
        });
      };

      applyHand(lv.lh, "lh");
      applyHand(lv.rh, "rh");

      // Teclado da Voz
      document.querySelectorAll("#voice-bed .w-key, #voice-bed .b-key").forEach(k => {
        k.classList.remove("vox-target", "now-playing");
        k.querySelectorAll(".f-dot").forEach(d => d.remove());
      });
      if (state.showVoicePanel && step.voice) {
        step.voice.forEach(v => {
          const keyEl = document.querySelector(`#voice-bed [data-note="${v.note}"]`);
          if (!keyEl) return;
          keyEl.classList.add("vox-target");
          if (focusT >= 0 && focusT >= v.tick && focusT < v.tick + v.dur) keyEl.classList.add("now-playing");
        });
      }
    }

    function renderMeasureView() {
      const step = STEPS[state.stepIndex];
      if (!step) return;
      const lv = step.levels[state.level] || step.levels.faithful;

      document.getElementById("step-counter").textContent = `Compasso ${step.id} / ${STEPS.length}`;
      document.getElementById("chord-badge").textContent = lv.chord;
      document.getElementById("measure-badge").textContent = step.tag;
      document.getElementById("step-title").textContent = step.title;
      document.getElementById("step-lyric").textContent = step.lyric;
      document.getElementById("step-tip").textContent = lv.tip;
      document.getElementById("step-select").value = state.stepIndex;

      document.getElementById("btn-prev").disabled = state.stepIndex === 0;
      document.getElementById("btn-next").disabled = state.stepIndex === STEPS.length - 1;
      document.getElementById("btn-unfreeze").classList.toggle("hidden", state.frozenTick < 0);

      document.querySelectorAll(".sec-chip").forEach(c => {
        const active = parseInt(c.dataset.sec, 10) === step.sectionId;
        c.className = `sec-chip px-2.5 py-1 rounded-xl text-xs font-bold cursor-pointer transition ${active ? "bg-blue-600 text-white" : "card text-[var(--text-main)]"}`;
      });

      document.querySelectorAll(".tl-pill").forEach((p, idx) => {
        p.className = `tl-pill px-2 py-0.5 rounded-lg text-[11px] font-mono-code font-bold cursor-pointer whitespace-nowrap ${idx === state.stepIndex ? "bg-emerald-600 text-white" : "card text-[var(--text-muted)]"}`;
      });

      renderSheetSVG();
      updateKeyboardsHighlight();
    }

    /* ==========================================================================
       5. MOTOR DE REPRODUÇÃO CONTÍNUA (COMPASSO / SEÇÃO / MÚSICA INTEIRA)
       ========================================================================== */
    function triggerTickAudio(step, tick) {
      const lv = step.levels[state.level] || step.levels.faithful;
      const secPerTick = (60 / state.bpm) / 4;

      if (document.getElementById("chk-metro")?.checked && tick % 4 === 0) {
        playMetroClick(tick === 0);
      }
      if (state.handMode !== "rh") {
        lv.lh.filter(e => e.tick === tick).forEach(e => {
          e.notes.forEach(n => playTone(n, Math.max(0.25, e.dur * secPerTick * 0.95), 0.72, false));
        });
      }
      if (state.handMode !== "lh") {
        lv.rh.filter(e => e.tick === tick).forEach(e => {
          e.notes.forEach(n => playTone(n, Math.max(0.22, e.dur * secPerTick * 0.92), 0.78, false));
        });
      }
      if (state.showVoicePanel && document.getElementById("chk-voice-audio")?.checked && step.voice) {
        step.voice.filter(v => v.tick === tick).forEach(v => {
          playTone(v.note, Math.max(0.25, v.dur * secPerTick * 0.95), 0.65, true);
        });
      }
    }

    function stopPlay(resetTick = true) {
      state.isPlaying = false;
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
      if (resetTick) state.activeTick = -1;
      document.getElementById("btn-play-song").textContent = "🎵 Música Inteira";
      document.getElementById("btn-play-section").textContent = "▶▶ Seção";
      document.getElementById("btn-play-step").textContent = "▶ Compasso";
      renderMeasureView();
    }

    function startPlay(mode, keepCurrentTick = false) {
      if (state.isPlaying && !keepCurrentTick && state.playMode === mode) {
        stopPlay(true);
        return;
      }
      if (state.timer) clearInterval(state.timer);
      ensureAudioCtx();
      state.isPlaying = true;
      state.playMode = mode;
      state.frozenTick = -1;

      if (!keepCurrentTick) {
        state.activeTick = 0;
        triggerTickAudio(STEPS[state.stepIndex], 0);
      }

      document.getElementById("btn-play-song").textContent = mode === "song" ? "⏸ Pausar" : "🎵 Música Inteira";
      document.getElementById("btn-play-section").textContent = mode === "section" ? "⏸ Pausar" : "▶▶ Seção";
      document.getElementById("btn-play-step").textContent = mode === "step" ? "⏸ Pausar" : "▶ Compasso";
      renderMeasureView();

      const tickMs = ((60 / state.bpm) / 4) * 1000;
      state.timer = setInterval(() => {
        state.activeTick++;
        if (state.activeTick >= 16) {
          state.activeTick = 0;
          const loop = document.getElementById("chk-loop")?.checked;
          const curStep = STEPS[state.stepIndex];

          if (state.playMode === "step") {
            if (!loop) { stopPlay(true); return; }
          } else if (state.playMode === "section") {
            const nextStep = STEPS[state.stepIndex + 1];
            if (nextStep && nextStep.sectionId === curStep.sectionId) {
              state.stepIndex++;
            } else if (loop) {
              state.stepIndex = STEPS.findIndex(s => s.sectionId === curStep.sectionId);
            } else {
              stopPlay(true);
              return;
            }
          } else if (state.playMode === "song") {
            if (state.stepIndex < STEPS.length - 1) {
              state.stepIndex++;
            } else if (loop) {
              state.stepIndex = 0;
            } else {
              stopPlay(true);
              return;
            }
          }
        }
        triggerTickAudio(STEPS[state.stepIndex], state.activeTick);
        renderMeasureView();
      }, tickMs);
    }

    /* ==========================================================================
       6. INICIALIZAÇÃO E EVENTOS DE UI
       ========================================================================== */
    function buildTimelineOnce() {
      const tabBox = document.getElementById("section-tabs");
      const tlBox = document.getElementById("timeline-strip");
      tabBox.innerHTML = "";
      tlBox.innerHTML = "";

      SECTIONS.forEach(sec => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.sec = sec.id;
        btn.className = "sec-chip px-2.5 py-1 rounded-xl text-xs font-bold card cursor-pointer";
        btn.textContent = sec.name;
        btn.addEventListener("click", () => {
          const idx = STEPS.findIndex(s => s.sectionId === sec.id);
          if (idx !== -1) {
            state.stepIndex = idx;
            state.frozenTick = -1;
            if (state.isPlaying) state.activeTick = 0;
            renderMeasureView();
          }
        });
        tabBox.appendChild(btn);
      });

      STEPS.forEach((st, idx) => {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "tl-pill px-2 py-0.5 rounded-lg text-[11px] font-mono-code font-bold card cursor-pointer";
        pill.textContent = `${st.id}`;
        pill.title = `${st.tag} — ${st.title}`;
        pill.addEventListener("click", () => {
          state.stepIndex = idx;
          state.frozenTick = -1;
          if (state.isPlaying) state.activeTick = 0;
          renderMeasureView();
        });
        tlBox.appendChild(pill);
      });
    }

    function applySongPack(songId) {
      if (!SONGS[songId]) return;
      if (state.isPlaying) stopPlay(true);
      state.songId = songId;
      const pack = SONGS[songId];
      SECTIONS = pack.sections;
      STEPS = pack.steps;
      state.stepIndex = 0;
      state.activeTick = -1;
      state.frozenTick = -1;

      document.getElementById("song-meta-tag").textContent = pack.meta.info;

      const sel = document.getElementById("step-select");
      sel.innerHTML = "";
      SECTIONS.forEach(sec => {
        const grp = document.createElement("optgroup");
        grp.label = sec.name;
        STEPS.forEach((st, i) => {
          if (st.sectionId !== sec.id) return;
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = `${st.tag} — ${st.title}`;
          grp.appendChild(opt);
        });
        sel.appendChild(grp);
      });

      const presetWrap = document.getElementById("bpm-presets");
      presetWrap.innerHTML = "";
      pack.meta.presets.forEach(b => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "px-2 py-1 rounded-lg text-[11px] font-mono-code font-bold card text-[var(--text-main)] cursor-pointer";
        btn.textContent = String(b);
        btn.addEventListener("click", () => setBpm(b));
        presetWrap.appendChild(btn);
      });

      setBpm(pack.meta.defaultBpm);
      buildTimelineOnce();
      renderMeasureView();
    }

    function setBpm(v) {
      state.bpm = v;
      document.getElementById("bpm-slider").value = v;
      document.getElementById("bpm-text").textContent = `${v} BPM`;
      if (state.isPlaying) startPlay(state.playMode, true);
    }

    function updateHandButtons() {
      document.querySelectorAll(".hand-btn").forEach(btn => {
        const active = btn.dataset.hand === state.handMode;
        btn.className = `hand-btn px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer transition ${active ? "bg-blue-600 text-white shadow-sm" : "text-[var(--text-main)] hover:opacity-80"}`;
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      buildPianoBed("piano-bed", PIANO_NOTES, false);
      buildPianoBed("voice-bed", VOICE_NOTES, true);
      updateHandButtons();

      // Tema inicial
      if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }

      document.getElementById("song-select").addEventListener("change", e => applySongPack(e.target.value));
      document.getElementById("level-select").addEventListener("change", e => {
        state.level = e.target.value;
        renderMeasureView();
      });

      document.getElementById("btn-play-song").addEventListener("click", () => startPlay("song"));
      document.getElementById("btn-play-section").addEventListener("click", () => startPlay("section"));
      document.getElementById("btn-play-step").addEventListener("click", () => startPlay("step"));

      document.getElementById("btn-prev").addEventListener("click", () => {
        if (state.stepIndex > 0) {
          state.stepIndex--;
          state.frozenTick = -1;
          renderMeasureView();
        }
      });
      document.getElementById("btn-next").addEventListener("click", () => {
        if (state.stepIndex < STEPS.length - 1) {
          state.stepIndex++;
          state.frozenTick = -1;
          renderMeasureView();
        }
      });
      document.getElementById("step-select").addEventListener("change", e => {
        state.stepIndex = parseInt(e.target.value, 10);
        state.frozenTick = -1;
        renderMeasureView();
      });

      document.getElementById("btn-sheet-zoom").addEventListener("click", e => {
        state.zoomOneMeasure = !state.zoomOneMeasure;
        e.target.textContent = state.zoomOneMeasure ? "🔍 Zoom: 1 Compasso" : "📄 2 Compassos";
        renderSheetSVG();
      });

      document.getElementById("chk-notes-on-sheet").addEventListener("change", e => {
        state.showCiphers = e.target.checked;
        renderSheetSVG();
      });

      document.getElementById("btn-unfreeze").addEventListener("click", () => {
        state.frozenTick = -1;
        renderMeasureView();
      });

      document.getElementById("btn-toggle-voice").addEventListener("click", () => {
        state.showVoicePanel = !state.showVoicePanel;
        document.getElementById("voice-keyboard-panel").classList.toggle("hidden", !state.showVoicePanel);
        document.getElementById("legend-voice-pill").classList.toggle("hidden", !state.showVoicePanel);
        renderMeasureView();
      });

      document.getElementById("btn-toggle-map").addEventListener("click", () => {
        document.getElementById("sections-drawer").classList.toggle("hidden");
      });

      document.getElementById("btn-focus").addEventListener("click", () => {
        document.body.classList.toggle("focus-mode");
      });

      document.getElementById("btn-theme").addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        renderSheetSVG();
      });

      document.querySelectorAll(".hand-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.handMode = btn.dataset.hand;
          updateHandButtons();
          renderMeasureView();
        });
      });

      document.getElementById("bpm-slider").addEventListener("input", e => setBpm(parseInt(e.target.value, 10)));

      document.addEventListener("keydown", e => {
        if (["SELECT", "INPUT"].includes(document.activeElement?.tagName)) return;
        if (e.code === "Space") {
          e.preventDefault();
          state.isPlaying ? stopPlay(true) : startPlay("song");
        } else if (e.code === "ArrowRight" && state.stepIndex < STEPS.length - 1) {
          state.stepIndex++;
          state.frozenTick = -1;
          renderMeasureView();
        } else if (e.code === "ArrowLeft" && state.stepIndex > 0) {
          state.stepIndex--;
          state.frozenTick = -1;
          renderMeasureView();
        } else if (e.key === "f" || e.key === "F") {
          document.body.classList.toggle("focus-mode");
        }
      });

      applySongPack("todo-no");
      initSoundfont();
    });
  </script>
</body>
</html>
